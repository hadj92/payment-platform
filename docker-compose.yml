# Environnement de developpement local : PostgreSQL seul.
# Le PSP est simule dans l'application, il n'y a donc rien a lancer pour lui.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      # Mot de passe de developpement local uniquement. En production, la tache obtient
      # un jeton IAM de 15 minutes aupres d'Aurora : il n'y a aucun mot de passe.
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
